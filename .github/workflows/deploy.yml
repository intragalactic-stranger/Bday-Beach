name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Personal details live in repo secrets (Settings → Secrets and variables → Actions),
      # never in the code. See .env.example for the expected formats.
      - name: Build
        run: npm run build
        env:
          VITE_PARTNER_NAME: ${{ secrets.VITE_PARTNER_NAME }}
          VITE_BIRTH_DATE: ${{ secrets.VITE_BIRTH_DATE }}
          VITE_BIRTH_TIME: ${{ secrets.VITE_BIRTH_TIME }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
